[package]
name = "skyblock-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
skyblock-proto = { path = "../crates/proto" }

# Not part of the main workspace: `cargo fuzz` needs nightly and libFuzzer.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packet"
path = "fuzz_targets/packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inner"
path = "fuzz_targets/inner.rs"
test = false
doc = false
bench = false
