[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/sys",
    "crates/client",
    "crates/server",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
skyblock-proto = { path = "crates/proto" }
skyblock-sys = { path = "crates/sys" }

aes = "0.9"
aes-gcm = "0.11"
anyhow = "1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8"
hkdf = "0.13"
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
mio = { version = "1", features = ["net", "os-poll", "os-ext"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
# Without "std": snow's std feature pulls in ring, which needs a C toolchain
# and complicates cross-compiling the server to musl.
snow = { version = "0.10", default-features = false, features = ["default-resolver-crypto", "risky-raw-split"] }
socket2 = "0.6"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
windows-sys = "0.61"
x25519-dalek = { version = "3", features = ["static_secrets"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1
