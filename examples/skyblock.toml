# skyblock client configuration.
# Put this file next to skyblock.exe (or pass -c <path>).

# From `skyblock keygen`; give the printed public key to each node's
# `skyblock-server adduser`.
private_key = "<your private key>"

# windivert (Windows, per process) | tun (Windows: Wintun adapter, needs
# wintun.dll next to skyblock.exe; Linux: TUN, used by the testbed)
# mode = "windivert"
# default_node = "tokyo-1"

# Paste the block printed by `skyblock-server adduser` for each node.
[[node]]
name = "tokyo-1"
addr = "203.0.113.10"
ports = [40001, 40002]
public_key = "<node public key>"
# psk = "<optional pre-shared key>"

[tunnel]
# paths = 2             # UDP sockets to the node (socket i uses ports[i % len])
# copies = 2            # copies of each game packet, both directions (1 = off)
# copies_max = 3        # under loss, up to this many (= copies: fixed)
# copy_delay_ms = 2.0   # gap between copies
# nack = true           # resend lost game packets on request (both directions)
# piggyback = 0         # recent game packets carried in each one (0-8)
# bulk_rate_mbps = 0    # node shapes downloads to this; set it a bit below
#                       # your line's download speed to keep the game fast
#                       # while downloading (0 = off)
# mtu = 1400            # upper bound; the node's value wins if lower
# pad_max = 48
# bulk_enter_kbps = 2000  # flows faster than this for 1s get a single copy
# bulk_exit_kbps = 1000   # ...until they stay below this for 5s
# rekey_interval_s = 600  # fresh keys inside the session; 0 = never

[dns]
# rules: queries for the games' `domains` (and subdomains) resolve through
#        the node, the rest directly; all: every query; off: none.
# mode = "rules"

# mode = "tun" only: what goes into the tunnel.
[tun]
# global = false        # true: everything (Windows); DNS via the node too
# routes = []           # extra ranges, on top of the games' ip_ranges

# `skyblock games` lists built-in templates: naming one brings its process
# names and domains along. Executable names are the ones in Task Manager's
# "Details" tab; `domains` only matter for [dns] mode = "rules";
# `ip_ranges` only for mode = "tun" without global (`skyblock games
# --ranges NAME` prints them for games with their own network).
[[game]]
name = "cs2"

[[game]]
name = "valorant"
# process = ["VALORANT-Win64-Shipping.exe"]   # already in the template
